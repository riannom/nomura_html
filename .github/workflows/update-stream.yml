name: Update stream

on:
  # Fired by admin.html: POST /repos/{owner}/{repo}/dispatches
  repository_dispatch:
    types: [update-stream]
  # No-token fallback: Actions tab -> "Update stream" -> Run workflow
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL (https://www.youtube.com/... or https://youtu.be/...). Optional for 'interrupted' (empty keeps the previous URL). Ignored when 'clear' is ticked."
        required: false
        type: string
      clear:
        description: "Clear the stream URL (writes an empty url; viewers see the placeholder)"
        required: false
        type: boolean
        default: false
      status:
        description: "Stream status"
        required: true
        type: choice
        options: [live, interrupted]
        default: live
      live:
        description: "Viewer visibility: 'true' = Live (show the stream), 'false' = Not Live (placeholder even with a URL), 'keep' = unchanged"
        required: false
        type: choice
        options: [keep, "true", "false"]
        default: keep
  # Normal edits to main publish too
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# One run at a time; queued runs wait (never cancel a half-done deploy).
concurrency:
  group: stream-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate and write COL/stream.json
        if: github.event_name != 'push'
        env:
          # Inputs arrive via env only; never interpolated into the script.
          IN_URL: ${{ github.event.client_payload.url || inputs.url }}
          IN_STATUS: ${{ github.event.client_payload.status || inputs.status }}
          IN_CLEAR: ${{ github.event.client_payload.clear || inputs.clear }}
          IN_LIVE: ${{ github.event.client_payload.live || inputs.live }}
        run: |
          set -euo pipefail
          url="$IN_URL"
          status="$IN_STATUS"
          if [[ "$status" != "live" && "$status" != "interrupted" ]]; then
            echo "::error::status must be 'live' or 'interrupted'"; exit 1
          fi
          if [[ "$IN_CLEAR" == "true" ]]; then
            url=""                                          # explicit clear: empty url, nothing to validate
          else
            if [[ -z "$url" && "$status" == "interrupted" ]]; then
              url="$(jq -r '.url // ""' COL/stream.json)"   # keep previous URL (may already be cleared)
            elif [[ -z "$url" ]]; then
              echo "::error::url is required for 'live' (to empty it, use clear)"; exit 1
            fi
          fi
          if [[ -n "$url" ]]; then
            re='^https://(www\.|m\.)?(youtube\.com|youtu\.be)/[A-Za-z0-9._~:/?#@!$&()*+,;=%-]*$'
            if (( ${#url} > 500 )) || ! [[ "$url" =~ $re ]]; then
              echo "::error::url must be an https youtube.com or youtu.be link (or use clear)"; exit 1
            fi
          fi
          # live: "true"/"false" sets it; anything else keeps the previous value (absent stays absent).
          live="$IN_LIVE"
          if [[ "$live" != "true" && "$live" != "false" ]]; then
            live="$(jq -r 'if has("live") then (.live | tostring) else "" end' COL/stream.json 2>/dev/null || echo '')"
          fi
          old="$(jq -c '{url, status, live}' COL/stream.json 2>/dev/null || echo '{}')"
          new="$(jq -cn --arg url "$url" --arg status "$status" --arg live "$live" '{url: $url, status: $status, live: (if $live == "" then null else ($live == "true") end)}')"
          if [[ "$old" == "$new" ]]; then
            echo "No change in url/status/live; nothing to commit."
            exit 0
          fi
          jq -n --arg url "$url" --arg status "$status" --arg live "$live" \
                --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{url: $url, status: $status} + (if $live == "" then {} else {live: ($live == "true")} end) + {updated: $updated}' > COL/stream.json.tmp
          mv COL/stream.json.tmp COL/stream.json
          echo "COL/stream.json is now:"; cat COL/stream.json

      - name: Commit if changed
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          if git diff --quiet -- COL/stream.json; then echo "Nothing to commit."; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COL/stream.json
          git commit -m "Update stream: $(jq -r 'if .url == "" then .status + " (url cleared)" else .status end + (if .live == false then ", not live" elif .live == true then ", live on" else "" end)' COL/stream.json)"
          git push || { git pull --rebase origin main && git push; }

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Root landing page, the stream site in COL/, and the lowercase col/ redirect
          cp index.html .nojekyll _site/
          cp -R COL col _site/
          if [[ -f CNAME ]]; then cp CNAME _site/; fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v5
