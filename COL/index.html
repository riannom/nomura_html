<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carolyn Nomura&#39;s Celebration of Life</title>
<script>
  // ======================= EDIT ONLY THIS BLOCK =======================
  // What viewers see when the stream is NOT live (before it starts, or when
  // the admin page is set to "interrupted").
  const PLACEHOLDER = {
    // Round photo above the heading (file in the COL folder). A .jpg with the same
    // name is used as a fallback for older browsers. Leave "" to hide it.
    photo: "carolyn.webp",
    // Small line above the heading. Leave "" to hide it.
    subtitle: "In loving memory",
    // Big heading text.
    title: "Carolyn Nomura's Celebration of Life",
    // Smaller text under the heading.
    message: "The live stream will begin shortly. Please keep this page open; it will switch to the stream automatically.",
    // Text shown instead of "message" while no stream URL is set (cleared on the admin page).
    noStreamMessage: "The live stream begins Saturday, October 17 at 10:00 AM HST.",
    // Scheduled start, ISO format WITH the UTC offset (Hawaii is -10:00),
    // e.g. "2026-10-10T14:00:00-10:00" for 2:00 PM Hawaii time.
    // Only used for the countdown text; the player itself appears only once YouTube reports the stream is live.
    startTime: "2026-10-17T10:00:00-10:00",
    // Only affects the ?preview=waiting test layout. Normal visitors never see the player
    // until the stream is actually live (same look as when no URL is set).
    showWaitingPlayer: true,
    // While live, keep the small subtitle and title above the video (true or false).
    liveShowHeader: true,
    // Soft drifting points of light with faint threads in the background (true or false).
    lights: true,
    // Base background color under the soft moving glow (any CSS color, e.g. "#000000" or "navy").
    backgroundColor: "#120a1f",
    // Text color.
    textColor: "#efe9f5",
    // Optional background image URL (full https:// link). Replaces the moving glow. Leave "" for none.
    backgroundImage: "",
    // Optional link shown at the bottom. Leave both "" to hide it.
    linkText: "",
    linkUrl: ""
  };

  // Fallback YouTube channel ID (starts with "UC"), used only when stream.json has no usable video.
  // Find yours in YouTube Studio: Settings > Channel > Advanced settings.
  const CHANNEL_ID = "UCuElo0lPHVOnut0zSOM3oAw";
  // ===================== END OF EDITABLE BLOCK ========================

  // Testing helpers (add to the page URL, combine with &):
  //   ?offline=1        always show the placeholder (no player)
  //   ?video=<11-char>  use this YouTube video id instead of the one in stream.json
  //                     (e.g. ?video=xxxxxxxxxxx to test the "video unavailable" path)
  //   ?start=<ISO>      override startTime, e.g. ?start=2026-10-10T14:00:00-10:00
  //   ?start=+15        override startTime to 15 minutes from now (-5 = 5 minutes ago)
  //   ?preview=live&video=<id>        preview the live layout with that video (ignores stream.json)
  //   ?preview=waiting&video=<id>     preview the pre-start screen with the small player
  //   ?preview=transition&video=<id>  pre-start screen, then switches to the live layout after 8 seconds
  //   (preview only works together with a valid ?video= id, so normal links never trigger it)
</script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  [hidden] { display: none !important; }
  #placeholder {
    position: fixed; inset: 0; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 5vmin 7vw; text-align: center; overflow: hidden;
    --m: 1.25rem; --hdr: 6.6rem; --vh: 100vh;
    transition: padding .9s cubic-bezier(.2,.7,.2,1);
    background-size: cover; background-position: center; background-repeat: no-repeat;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #placeholder > * { position: relative; z-index: 1; }
  /* Dusk background: slow, soft purple and teal light (hidden when a backgroundImage is set) */
  #placeholder > .ph-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; filter: blur(80px); }
  #placeholder.has-image > .ph-bg { display: none; }
  .ph-bg i { position: absolute; display: block; border-radius: 50%; will-change: transform; }
  .ph-bg .g1 { width: 75vmax; height: 75vmax; left: -25vmax; top: -30vmax; opacity: .55;
    background: radial-gradient(circle, #3b1f5c 0%, #2a1544 55%, transparent 70%); animation: ph-d1 52s ease-in-out infinite alternate; }
  .ph-bg .g2 { width: 55vmax; height: 55vmax; right: -22vmax; top: 5vmax; opacity: .26;
    background: radial-gradient(circle, #7c3aed 0%, #4c1d95 50%, transparent 70%); animation: ph-d2 60s ease-in-out infinite alternate; }
  .ph-bg .g3 { width: 40vmax; height: 40vmax; left: 20vmax; bottom: -24vmax; opacity: .28;
    background: radial-gradient(circle, #2dd4bf 0%, #0d9488 45%, transparent 70%); animation: ph-d3 44s ease-in-out infinite alternate; }
  .ph-bg .g4 { width: 60vmax; height: 60vmax; right: -10vmax; bottom: -35vmax; opacity: .5;
    background: radial-gradient(circle, #2a1544 0%, #1a0f2e 60%, transparent 72%); animation: ph-d4 56s ease-in-out infinite alternate; }
  /* Lights layer: soft points of light and faint threads (drawn by the script at the end) */
  #placeholder > #lights { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; }
  #placeholder > .ph-vignette { position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(6,3,12,.6) 100%); }
  @keyframes ph-d1 { to { transform: translate(14vw, 10vh) scale(1.1); } }
  @keyframes ph-d2 { to { transform: translate(-12vw, 14vh) scale(.92); } }
  @keyframes ph-d3 { to { transform: translate(-16vw, -10vh) scale(1.15); } }
  @keyframes ph-d4 { to { transform: translate(-10vw, -8vh) scale(1.08); } }

  /* Round photo with a thin teal-to-violet ring and a soft glow */
  #ph-photo { flex: none; box-sizing: border-box; width: clamp(96px, min(30vw, 19vh), 168px); aspect-ratio: 1; max-height: 200px;
    margin: 0 0 1.5rem; padding: 2px; border-radius: 50%;
    background: linear-gradient(140deg, #2dd4bf, #7c3aed 55%, #a78bfa);
    box-shadow: 0 0 22px rgba(45,212,191,.18), 0 0 46px rgba(124,58,237,.22);
    animation: ph-fade 2.4s ease-out backwards; }
  #ph-photo picture { display: block; width: 100%; height: 100%; }
  #ph-photo img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    background: radial-gradient(circle at 50% 40%, #2a1544, #160c26); }
  @keyframes ph-fade { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  @media (max-height: 560px) { #ph-photo { display: none !important; } }
  #ph-kicker { margin: 0 0 1.1em; max-height: 4em; font-size: clamp(.7rem, 2.2vw, .85rem); letter-spacing: .32em; text-transform: uppercase; opacity: .7; padding-left: .32em; }
  #ph-title { margin: 0; max-width: 18em; max-height: 6em; overflow-wrap: anywhere;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    font-weight: 400; font-size: clamp(1.9rem, 6.4vw, 3.6rem); line-height: 1.15; letter-spacing: .01em;
    text-shadow: 0 0 28px rgba(124,58,237,.25); }
  /* Thin accent line with a slow, candle-like glow */
  #placeholder > .ph-line { width: min(9rem, 40vw); height: 1px; margin: 1.4em 0 1.3em;
    background: linear-gradient(90deg, transparent, #2dd4bf 30%, #a78bfa 70%, transparent);
    animation: ph-breathe 7s ease-in-out infinite; }
  @keyframes ph-breathe { 0%, 100% { opacity: .55; box-shadow: 0 0 6px rgba(45,212,191,.25); } 50% { opacity: 1; box-shadow: 0 0 14px rgba(45,212,191,.55); } }
  #ph-start { margin: 0; font-size: clamp(.95rem, 2.8vw, 1.15rem); letter-spacing: .06em; opacity: .85; }
  #ph-countdown { margin: .45em 0 0; font-size: clamp(.85rem, 2.5vw, 1rem); letter-spacing: .08em; font-variant-numeric: tabular-nums; color: #5eead4; opacity: .75; }
  #ph-message { margin: 1.2em 0 0; max-width: 34em; overflow-wrap: anywhere;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    font-style: italic; font-size: clamp(1rem, 2.9vw, 1.2rem); line-height: 1.55; opacity: .78; }
  #ph-link { margin-top: 1.4em; font-size: clamp(.9rem, 2.6vw, 1rem); letter-spacing: .04em; color: #5eead4; text-decoration: none; border-bottom: 1px solid rgba(94,234,212,.45); padding-bottom: 2px; }
  #ph-link:hover, #ph-link:focus-visible { border-bottom-color: #5eead4; }
  #placeholder.has-image > * { text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  /* "Live" indicator (live layout only) */
  #ph-live { margin: 0; max-height: 0; opacity: 0; overflow: hidden; font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; color: #5eead4;
    display: flex; align-items: center; gap: .55em; padding-left: .22em; }
  #ph-live i { width: 6px; height: 6px; border-radius: 50%; background: #2dd4bf; box-shadow: 0 0 8px #2dd4bf; animation: ph-pulse 2.6s ease-in-out infinite; }
  @keyframes ph-pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  /* Flexible spacers: their sizes animate so the layout glides between pre-start and live */
  #placeholder > .sp { flex: 0 0 0; min-height: 0; }
  #placeholder > .sp-top, #placeholder > .sp-bot { flex-grow: 1; }

  /* One iframe container for both layouts; switching layout only changes CSS,
     so the iframe is never re-inserted (re-inserting an iframe reloads it). */
  #frame { flex: none; margin-top: 1.8em; width: min(86vw, 560px, 60vh); aspect-ratio: 16 / 9; background: #000;
    border: 1px solid rgba(45,212,191,.4); border-radius: 10px; overflow: hidden;
    box-shadow: 0 0 0 5px rgba(45,212,191,.05), 0 0 36px rgba(45,212,191,.16), 0 24px 60px rgba(0,0,0,.45); }
  #frame.invisible { position: absolute; left: 0; top: 0; width: 320px; opacity: 0; pointer-events: none; margin: 0; z-index: 0; }
  #frame iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* Smooth changes between layouts */
  #placeholder > .sp, #frame, #ph-photo, #ph-kicker, #ph-title, #placeholder > .ph-line, #ph-live, #ph-start, #ph-countdown, #ph-message, #ph-link {
    transition: flex-grow .9s cubic-bezier(.2,.7,.2,1), width .9s cubic-bezier(.2,.7,.2,1), margin .9s cubic-bezier(.2,.7,.2,1),
      font-size .9s cubic-bezier(.2,.7,.2,1), max-height .9s ease, opacity .6s ease, border-radius .9s ease; }
  #ph-start, #ph-countdown { max-height: 4em; }
  #ph-message, #ph-link { max-height: 12em; }

  /* ---- Live layout: compact header on top, large framed video below ---- */
  body.mode-player #placeholder { padding: var(--m); }
  body.mode-player #placeholder > .sp-top { flex-grow: 0; }
  body.mode-player #placeholder > .sp-mid { flex-grow: 1; }
  body[data-state="waiting"] #ph-photo { width: clamp(80px, min(24vw, 14vh), 132px); margin-bottom: 1.1rem; }
  body.mode-player #ph-photo { width: 0; max-height: 0; padding: 0; margin: 0; opacity: 0; box-shadow: none; }
  body.mode-player #ph-kicker { margin: 0 0 .45rem; font-size: .66rem; }
  body.mode-player #ph-title { font-size: clamp(1.05rem, 4.2vw, 1.45rem); max-width: none; }
  body.mode-player #placeholder > .ph-line { margin: .55rem 0 .5rem; }
  body.mode-player #ph-live { max-height: 2em; opacity: .9; }
  body.mode-player #ph-start, body.mode-player #ph-countdown, body.mode-player #ph-message, body.mode-player #ph-link {
    max-height: 0; opacity: 0; margin: 0; overflow: hidden; }
  body.mode-player #frame.full { margin: .8rem 0 0; border-radius: 12px;
    width: min(100vw - 2 * var(--m), (var(--vh) - var(--hdr) - 2 * var(--m)) * 16 / 9); }
  /* Header hidden (config, or very short screens such as a phone in landscape) */
  body.mode-player.no-live-header #placeholder, body.is-fs.no-live-header #placeholder { --hdr: 0px; }
  body.mode-player.no-live-header #ph-kicker, body.mode-player.no-live-header #ph-title,
  body.mode-player.no-live-header #placeholder > .ph-line, body.mode-player.no-live-header #ph-live {
    max-height: 0; height: 0; opacity: 0; margin: 0; overflow: hidden; }
  body.mode-player.no-live-header #frame.full { margin: 0; }
  @media (max-width: 600px) {
    #placeholder { --m: .6rem; --hdr: 7.4rem; }
    body.mode-player #ph-title { padding: 0 2.6rem; }   /* keep clear of the full-screen button */
  }
  /* Portrait screens: video sits closer to the header instead of mid-screen */
  @media (orientation: portrait) { body.mode-player #placeholder > .sp-mid { flex-grow: .35; } }
  @media (max-height: 500px) {
    #placeholder { --m: .4rem; --hdr: 0px; }
    body.mode-player #ph-kicker, body.mode-player #ph-title, body.mode-player #placeholder > .ph-line, body.mode-player #ph-live {
      max-height: 0; height: 0; opacity: 0; margin: 0; overflow: hidden; }
    body.mode-player #frame.full { margin: 0; border-radius: 8px; }
  }
  @supports (height: 100dvh) { #placeholder { --vh: 100dvh; } }

  /* Themed full screen (our button puts this whole page area into full screen) */
  #fs-btn { display: none; position: absolute; top: .7rem; right: .7rem; z-index: 3; width: 2.4rem; height: 2.4rem; padding: 0;
    align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; color: #ccfbf1;
    background: rgba(18,10,31,.45); border: 1px solid rgba(45,212,191,.35); opacity: .7;
    transition: opacity .3s ease, border-color .3s ease, box-shadow .3s ease; }
  #fs-btn:hover, #fs-btn:focus-visible { opacity: 1; border-color: #2dd4bf; box-shadow: 0 0 14px rgba(45,212,191,.35); outline: none; }
  #fs-btn svg { width: 1.05rem; height: 1.05rem; }
  #fs-btn .ic-exit, body.is-fs #fs-btn .ic-enter { display: none; }
  body.is-fs #fs-btn .ic-exit { display: block; }
  body.fs-ok.mode-player #fs-btn, body.is-fs #fs-btn { display: flex; }
  body.is-fs #placeholder { --m: .6rem; }

  @media (prefers-reduced-motion: reduce) {
    #placeholder .ph-bg i, #placeholder > .ph-line, #ph-live i, #ph-photo { animation: none; }
    #placeholder, #placeholder > *, #frame { transition: none !important; }
  }
</style>
</head>
<body>
<div id="placeholder">
  <div class="ph-bg" aria-hidden="true"><i class="g1"></i><i class="g2"></i><i class="g3"></i><i class="g4"></i></div>
  <div class="ph-vignette" aria-hidden="true"></div>
  <canvas id="lights" aria-hidden="true"></canvas>
  <button id="fs-btn" type="button" aria-label="Full screen" title="Full screen">
    <svg class="ic-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <svg class="ic-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
  </button>
  <div class="sp sp-top"></div>
  <div id="ph-photo" hidden></div>
  <p id="ph-kicker" hidden></p>
  <h1 id="ph-title"></h1>
  <div class="ph-line" aria-hidden="true"></div>
  <p id="ph-live"><i></i>Live</p>
  <p id="ph-start" hidden></p>
  <p id="ph-countdown" hidden></p>
  <p id="ph-message"></p>
  <div class="sp sp-mid"></div>
  <div id="frame" hidden></div>
  <a id="ph-link" target="_blank" rel="noopener" hidden></a>
  <div class="sp sp-bot"></div>
</div>
<script>
  // Themed full screen: our button full-screens the whole page area. Where the browser can't
  // full-screen a page element (iPhone Safari), keep YouTube's own full-screen button (fs=1).
  const ph = document.getElementById("placeholder");
  const FS_OK = !!((document.fullscreenEnabled && ph.requestFullscreen) || (document.webkitFullscreenEnabled && ph.webkitRequestFullscreen));
  const PARAMS = "autoplay=1&mute=1&playsinline=1&enablejsapi=1&fs=" + (FS_OK ? "0" : "1") +
    (/^https?:$/.test(location.protocol) ? "&origin=" + encodeURIComponent(location.origin) : "");
  const query = new URLSearchParams(location.search);
  const FORCE_OFFLINE = query.get("offline") === "1";
  const VIDEO_OVERRIDE = query.get("video") || "";
  const PREVIEW = ["live", "waiting", "transition"].includes(query.get("preview")) && /^[\w-]{11}$/.test(VIDEO_OVERRIDE) ? query.get("preview") : "";
  const PREVIEW_T0 = Date.now();
  const ERROR_CODES = [2, 5, 100, 101, 150, 153];
  const POLL_MS = 30000;
  const RETRY_ERRORED_MS = 60 * 1000;   // re-check a source that is not live (or YouTube rejected) after this long
  const REPROBE_MS = 60 * 1000;         // reload a hidden probe that has not started playing after this long
  const NOT_LIVE_CONFIRM_MS = 3000;     // PLAYING with isLive false for this long = replay/VOD, not live
  const ENDED = 0;
  const PLAYING = 1, BUFFERING = 3;

  const START_MS = (function () {
    const o = query.get("start");
    if (o && /^[+-]\d+(\.\d+)?$/.test(o)) return Date.now() + parseFloat(o) * 60000;
    const t = Date.parse(o || PLACEHOLDER.startTime || "");
    return isNaN(t) ? null : t;
  })();

  const frame = document.getElementById("frame");
  const elStart = document.getElementById("ph-start");
  const elCountdown = document.getElementById("ph-countdown");
  const elMessage = document.getElementById("ph-message");

  // Per loaded iframe
  let currentSrc = "", ytPlayer = null, loadToken = 0;
  let confirmedLive = false;   // player reported PLAYING/BUFFERING with isLive true
  let notLiveSince = 0;        // when PLAYING with isLive false was first seen
  let playableSeen = false;    // player reported the video is playable
  let lastState = null;
  let wasErrored = false;      // this load is a retry of a source that errored
  let lastReload = 0;
  let inspectPlayer = null;    // re-checks the current player's state (set by attachPlayer)
  const errored = {};          // src -> time YouTube reported it unplayable
  let lastStream = null;       // last {status, src} computed by refresh()

  // ---- placeholder content (textContent only, never innerHTML) ----
  (function setupPlaceholder() {
    const c = PLACEHOLDER;
    document.getElementById("ph-title").textContent = c.title || "";
    if (c.photo) {
      const box = document.getElementById("ph-photo");
      const pic = document.createElement("picture");
      const img = document.createElement("img");
      img.alt = "Carolyn Nomura";
      img.width = 168; img.height = 168;
      img.decoding = "async";
      if (/\.webp$/i.test(c.photo)) {
        const src = document.createElement("source");
        src.type = "image/webp";
        src.srcset = c.photo;
        pic.appendChild(src);
        img.src = c.photo.replace(/\.webp$/i, ".jpg");
      } else img.src = c.photo;
      pic.appendChild(img);
      box.appendChild(pic);
      box.hidden = false;
    }
    const kicker = document.getElementById("ph-kicker");
    if (c.subtitle) { kicker.textContent = c.subtitle; kicker.hidden = false; }
    elMessage.textContent = c.message || "";
    ph.style.backgroundColor = c.backgroundColor || "#000";
    ph.style.color = c.textColor || "#fff";
    if (c.backgroundImage) {
      ph.style.backgroundImage = "linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)), url(" + JSON.stringify(String(c.backgroundImage)) + ")";
      ph.classList.add("has-image");
    }
    const a = document.getElementById("ph-link");
    if (c.linkText && /^https?:\/\//i.test(c.linkUrl || "")) {
      a.textContent = c.linkText;
      a.href = c.linkUrl;
      a.hidden = false;
    }
    if (START_MS !== null) {
      let when;
      try {
        when = new Date(START_MS).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
      } catch (e) { when = new Date(START_MS).toString(); }
      elStart.textContent = "Starts " + when;
      elStart.hidden = false;
      elCountdown.hidden = false;
      tickCountdown();
      setInterval(tickCountdown, 1000);
    }
  })();

  function tickCountdown() {
    const left = Math.round((START_MS - Date.now()) / 1000);
    if (left <= 0) { elCountdown.textContent = "Starting soon\u2026"; return; }
    const d = Math.floor(left / 86400), h = Math.floor(left % 86400 / 3600), m = Math.floor(left % 3600 / 60), s = left % 60;
    const pad = n => String(n).padStart(2, "0");
    elCountdown.textContent = "Begins in " + (d ? d + "d " : "") + (d || h ? h + "h " : "") + pad(m) + "m " + pad(s) + "s";
  }

  // ---- layout options and full screen ----
  if (!PLACEHOLDER.liveShowHeader) document.body.classList.add("no-live-header");
  if (FS_OK) document.body.classList.add("fs-ok");
  const fsBtn = document.getElementById("fs-btn");
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
  fsBtn.addEventListener("click", function () {
    try {
      if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (ph.requestFullscreen || ph.webkitRequestFullscreen).call(ph);
    } catch (e) {}
  });
  function onFsChange() {
    const on = fsElement() === ph;
    document.body.classList.toggle("is-fs", on);
    fsBtn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
    fsBtn.title = on ? "Exit full screen" : "Full screen";
  }
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);

  function videoId(url) {
    try {
      const u = new URL(url);
      const host = u.hostname.replace(/^(www\.|m\.)/, "");
      if (host === "youtu.be") return u.pathname.slice(1).split("/")[0];
      if (host !== "youtube.com") return "";
      if (u.searchParams.get("v")) return u.searchParams.get("v");
      const m = u.pathname.match(/^\/(?:live|embed|shorts)\/([\w-]{11})/);
      return m ? m[1] : "";
    } catch (e) { return ""; }
  }
  const validId = id => /^[\w-]{11}$/.test(id);

  // ---- YouTube IFrame Player API (optional: the page still works if it fails to load) ----
  let apiReady = false;
  window.onYouTubeIframeAPIReady = function () { apiReady = true; attachPlayer(); };
  (function loadApi() {
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.async = true;
    document.head.appendChild(s);
  })();

  function videoData() {
    try { return (ytPlayer && ytPlayer.getVideoData && ytPlayer.getVideoData()) || {}; } catch (e) { return {}; }
  }

  function attachPlayer() {
    const iframe = document.getElementById("player");
    if (!apiReady || !iframe || ytPlayer) return;
    const token = loadToken, src = currentSrc;
    const mine = () => token === loadToken;
    const unplayable = () => {
      if (!mine()) return;
      errored[src] = Date.now();
      document.body.dataset.ytError = "1";
      render();
    };
    const inspect = () => {
      const d = videoData();
      // Only an explicit "not playable" signal hides the player; when unsure, keep it.
      if (d.isPlayable === false || (d.errorCode && d.errorCode !== 0)) { unplayable(); return; }
      if (d.isPlayable === true) playableSeen = true;
      // Live detection (no API key): a hidden, muted probe player autoplays the URL.
      // Upcoming/waiting-room streams never reach PLAYING; an ended stream's replay or a
      // normal video reaches PLAYING with isLive false; a channel that is not live errors.
      // Only PLAYING/BUFFERING with isLive true reveals the player.
      if (lastState === ENDED) { confirmedLive = false; unplayable(); return; }
      if ((lastState === PLAYING || lastState === BUFFERING) && d.isLive === true) {

      } else if (lastState === PLAYING && d.isLive === false && !confirmedLive) {
        // isLive can lag briefly right after start; require it to stay false.
        if (!notLiveSince) { notLiveSince = Date.now(); setTimeout(() => inspectPlayer && inspectPlayer(), NOT_LIVE_CONFIRM_MS + 100); }
        else if (Date.now() - notLiveSince >= NOT_LIVE_CONFIRM_MS) { notLiveSince = 0; unplayable(); return; }
      }
      document.body.dataset.ytIsLive = String(d.isLive);
      render();
    };
    inspectPlayer = () => { if (mine() && ytPlayer) { try { lastState = ytPlayer.getPlayerState(); } catch (x) {} inspect(); } };
    try {
      ytPlayer = new YT.Player(iframe, {
        events: {
          onReady: e => { if (!mine()) return; document.body.dataset.ytReady = "1";
            try { lastState = e.target.getPlayerState(); } catch (x) {} inspect(); },
          onStateChange: e => { if (!mine()) return; lastState = e.data; document.body.dataset.ytState = String(e.data); inspect(); },
          onError: e => { if (!mine()) return; document.body.dataset.ytErrorCode = String(e && e.data);
            if (ERROR_CODES.includes(e && e.data)) unplayable(); }
        }
      });
    } catch (e) { ytPlayer = null; }
  }

  // ---- player loading ----
  function clearPlayer() {
    loadToken++;
    ytPlayer = null; inspectPlayer = null; currentSrc = ""; lastState = null;
    confirmedLive = false; playableSeen = false; wasErrored = false; notLiveSince = 0;
    frame.textContent = "";   // removes the iframe and stops playback
  }

  function loadPlayer(src) {
    const retry = !!errored[src];
    clearPlayer();
    delete errored[src];
    wasErrored = retry;
    currentSrc = src;
    lastReload = Date.now();
    const iframe = document.createElement("iframe");
    iframe.id = "player";
    iframe.title = "Live stream";
    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.src = src;
    frame.appendChild(iframe);
    attachPlayer();
  }

  // ---- decide what to show ----
  function setMode(mode, reason) {
    // "probe" = a hidden player is checking whether the stream is live; it looks
    // exactly like "placeholder" (the no-URL screen).
    document.body.classList.toggle("mode-player", mode === "player");
    document.body.dataset.state = mode === "probe" ? "placeholder" : mode;   // placeholder | waiting (preview) | player
    document.body.dataset.probe = mode === "probe" ? "1" : "";
    document.body.dataset.reason = reason || "";
    // Not live (no URL, not started, ended, error): always the "begins on ..." text.
    elMessage.textContent = (mode !== "waiting" && PLACEHOLDER.noStreamMessage) ? PLACEHOLDER.noStreamMessage : (PLACEHOLDER.message || "");
    frame.hidden = mode === "placeholder";
    frame.classList.toggle("full", mode === "player");
    frame.classList.toggle("invisible", mode === "probe" || (mode === "waiting" && !PLACEHOLDER.showWaitingPlayer));
  }

  function render() {
    const s = lastStream;
    if (!s) return;
    if (s.mode === "placeholder") { clearPlayer(); setMode("placeholder", s.reason); return; }

    const src = s.src;
    if (src === currentSrc && errored[src]) { clearPlayer(); }   // just errored
    if (errored[src]) {
      if (Date.now() - errored[src] < RETRY_ERRORED_MS) { setMode("placeholder", "not-live"); return; }
      loadPlayer(src);               // re-check with a fresh hidden probe
    } else if (src !== currentSrc) {
      loadPlayer(src);               // unchanged src -> leave the iframe alone
    }

    if (PREVIEW) {   // test-only layouts (see ?preview= above)
      const live = PREVIEW === "live" || (PREVIEW === "transition" && Date.now() - PREVIEW_T0 >= 8000);
      setMode(live ? "player" : "waiting", "preview-" + PREVIEW);
      return;
    }
    if (confirmedLive) { setMode("player", "confirmed-live"); return; }

  }

  async function refresh() {
    if (FORCE_OFFLINE) { lastStream = { mode: "placeholder", reason: "forced" }; render(); return; }
    if (PREVIEW) { lastStream = { mode: "video", src: "https://www.youtube.com/embed/" + VIDEO_OVERRIDE + "?" + PARAMS }; render(); return; }
    let s = null;
    try {
      const r = await fetch("stream.json?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) s = await r.json();
    } catch (e) { s = null; }

    if (!VIDEO_OVERRIDE && s && typeof s === "object" && !(typeof s.url === "string" && s.url.trim())) {
      // URL cleared on the admin page: placeholder only (no video, no channel fallback).
      lastStream = { mode: "placeholder", reason: "no-url" };
    } else if (!VIDEO_OVERRIDE && s && typeof s === "object" && (s.status !== "live" || s.live === false)) {
      // status "interrupted", or staged as Not Live (live: false). A missing "live" behaves as before.
      lastStream = { mode: "placeholder", reason: s.live === false ? "not-live" : "status" };
    } else {
      const id = VIDEO_OVERRIDE || (s && typeof s.url === "string" ? videoId(s.url) : "");
      if (validId(id)) lastStream = { mode: "video", src: "https://www.youtube.com/embed/" + id + "?" + PARAMS };
      // No usable video id: try the channel's current live stream. If YouTube reports
      // it unavailable (channel not live), onError switches to the placeholder.
      else if (CHANNEL_ID) lastStream = { mode: "video", src: "https://www.youtube.com/embed/live_stream?channel=" + encodeURIComponent(CHANNEL_ID) + "&" + PARAMS };
      else lastStream = { mode: "placeholder", reason: "no-source" };
    }

    // Hidden probe still not live (e.g. waiting room, autoplay stalled): reload it every
    // REPROBE_MS so the player appears soon after the stream starts.
    if (!PREVIEW && lastStream.mode === "video" && lastStream.src === currentSrc && !confirmedLive &&
        document.body.dataset.probe === "1" && lastState !== PLAYING && lastState !== BUFFERING &&
        Date.now() - lastReload >= REPROBE_MS - 1000) {
      loadPlayer(currentSrc);
    } else if (inspectPlayer && lastStream.mode === "video" && lastStream.src === currentSrc) {
      inspectPlayer();   // re-evaluate (e.g. startTime has now passed); calls render()
      return;
    }
    render();
  }

  refresh();
  setInterval(refresh, POLL_MS);
  if (PREVIEW === "transition") setTimeout(render, 8100);

<script>
// ---- Background lights: slow, soft points of light with faint threads ----
// Independent of the stream logic above. Dimmer behind the text and the video.
(function () {
  "use strict";
  const canvas = document.getElementById("lights");
  const ctx = PLACEHOLDER.lights && canvas.getContext && canvas.getContext("2d");
  if (!ctx) { canvas.remove(); return; }
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const host = document.getElementById("placeholder");
  // pale teal, soft lavender, and rare warm gold / rose accents
  const COLORS = [[153, 246, 228], [196, 181, 253], [253, 224, 160], [251, 207, 232]];
  const pickColor = () => { const r = Math.random(); return r < 0.5 ? 0 : r < 0.88 ? 1 : r < 0.95 ? 2 : 3; };
  const CONTENT = ["ph-photo", "ph-kicker", "ph-title", "ph-live", "ph-start", "ph-countdown", "ph-message", "frame"];
  let W = 0, H = 0, dpr = 1, linkDist = 150, nodes = [], pulses = [], lanterns = [], sprites = [];
  let calm = null, live = false, raf = 0, last = 0, nextLantern = 0, lastKey = "";

  // Pre-drawn glow sprites (one per color) keep drawing cheap
  function makeSprites() {
    sprites = COLORS.map(c => {
      const s = document.createElement("canvas"), R = 32; s.width = s.height = R * 2;
      const g = s.getContext("2d"), rg = g.createRadialGradient(R, R, 0, R, R, R);
      rg.addColorStop(0, "rgba(255,255,255,1)");
      rg.addColorStop(0.12, `rgba(${c[0]},${c[1]},${c[2]},.9)`);
      rg.addColorStop(0.35, `rgba(${c[0]},${c[1]},${c[2]},.22)`);
      rg.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
      g.fillStyle = rg; g.fillRect(0, 0, R * 2, R * 2);
      return s;
    });
  }
  function makeNode() {
    const a = Math.random() * 6.2832, sp = 0.0018 + Math.random() * 0.0032;   // px per ms (very slow)
    return { x: Math.random() * W, y: Math.random() * H, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
             s: 7 + Math.random() * 7, c: pickColor(), ph: Math.random() * 6.2832, sp: 0.0003 + Math.random() * 0.0004 };
  }
  function setup() {
    const r = host.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    linkDist = Math.max(110, Math.min(190, Math.sqrt(W * H) / 5.5));
    const target = Math.round(Math.max(12, Math.min(30, W * H / 40000)));   // sparser than the home page
    while (nodes.length < target) nodes.push(makeNode());
    nodes.length = target;
    nodes.forEach(n => { n.x = Math.min(n.x, W); n.y = Math.min(n.y, H); });
    measure();
  }
  // Area to keep calm: the visible content (photo, title, text) or, while live, the video and header
  function measure() {
    live = document.body.classList.contains("mode-player");
    const hr = host.getBoundingClientRect();
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    CONTENT.forEach(id => {
      const e = document.getElementById(id);
      if (!e || e.hidden) return;
      const r = e.getBoundingClientRect();
      if (r.width < 2 || r.height < 2 || getComputedStyle(e).opacity < 0.05) return;
      x0 = Math.min(x0, r.left); y0 = Math.min(y0, r.top); x1 = Math.max(x1, r.right); y1 = Math.max(y1, r.bottom);
    });
    calm = x0 === Infinity ? null : { x0: x0 - hr.left, y0: y0 - hr.top, x1: x1 - hr.left, y1: y1 - hr.top };
  }
  // 1 far from the content, low inside it
  function calmFactor(x, y) {
    if (!calm) return 1;
    const dx = Math.max(calm.x0 - x, 0, x - calm.x1), dy = Math.max(calm.y0 - y, 0, y - calm.y1);
    const d = Math.sqrt(dx * dx + dy * dy), inside = live ? 0.05 : 0.18, edge = live ? 60 : 110;
    return d >= edge ? 1 : inside + (1 - inside) * (d / edge);
  }

  function step(dt, now) {
    for (const n of nodes) {
      n.x += n.vx * dt; n.y += n.vy * dt; n.ph += n.sp * dt;
      if (n.x < -30) n.x = W + 30; else if (n.x > W + 30) n.x = -30;
      if (n.y < -30) n.y = H + 30; else if (n.y > H + 30) n.y = -30;
    }
    // A rare, gentle glow travelling along a thread
    if (pulses.length < 2 && Math.random() < dt / 9000) {
      const a = nodes[(Math.random() * nodes.length) | 0];
      let best = null, bd = linkDist * 0.9;
      for (const b of nodes) { if (b === a) continue; const d = Math.hypot(a.x - b.x, a.y - b.y); if (d < bd) { bd = d; best = b; } }
      if (best) pulses.push({ a: a, b: best, t: 0 });
    }
    for (let k = pulses.length - 1; k >= 0; k--) { pulses[k].t += dt / 3200; if (pulses[k].t >= 1) pulses.splice(k, 1); }
    // Very rarely, a warm light rises slowly and fades, like a lantern
    if (!nextLantern) nextLantern = now + 15000 + Math.random() * 20000;
    if (now > nextLantern && lanterns.length < 1) {
      lanterns.push({ x: W * (0.08 + Math.random() * 0.84), y: H * (0.6 + Math.random() * 0.3), t: 0, c: Math.random() < 0.6 ? 2 : 3 });
      nextLantern = now + 30000 + Math.random() * 30000;
    }
    for (let k = lanterns.length - 1; k >= 0; k--) { lanterns[k].t += dt / 14000; if (lanterns[k].t >= 1) lanterns.splice(k, 1); }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const master = live ? 0.55 : 1;
    ctx.lineWidth = 0.6;
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j], dx = a.x - b.x, dy = a.y - b.y;
        if (Math.abs(dx) > linkDist || Math.abs(dy) > linkDist) continue;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d >= linkDist) continue;
        const t = 1 - d / linkDist;
        const alpha = t * t * 0.22 * master * Math.min(calmFactor(a.x, a.y), calmFactor(b.x, b.y));
        if (alpha < 0.004) continue;
        const ca = COLORS[a.c], cb = COLORS[b.c], g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        g.addColorStop(0, `rgba(${ca[0]},${ca[1]},${ca[2]},${alpha.toFixed(3)})`);
        g.addColorStop(1, `rgba(${cb[0]},${cb[1]},${cb[2]},${alpha.toFixed(3)})`);
        ctx.strokeStyle = g;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    for (const n of nodes) {
      const breathe = 0.5 + 0.3 * Math.sin(n.ph);
      ctx.globalAlpha = Math.max(0, breathe * master * calmFactor(n.x, n.y));
      ctx.drawImage(sprites[n.c], n.x - n.s, n.y - n.s, n.s * 2, n.s * 2);
    }
    for (const q of pulses) {
      const x = q.a.x + (q.b.x - q.a.x) * q.t, y = q.a.y + (q.b.y - q.a.y) * q.t;
      ctx.globalAlpha = Math.sin(q.t * Math.PI) * 0.5 * master * calmFactor(x, y);
      ctx.drawImage(sprites[0], x - 7, y - 7, 14, 14);
    }
    for (const l of lanterns) {
      const y = l.y - l.t * 110, x = l.x + Math.sin(l.t * 6) * 6;
      ctx.globalAlpha = Math.sin(l.t * Math.PI) * 0.55 * master * calmFactor(x, y);
      ctx.drawImage(sprites[l.c], x - 10, y - 10, 20, 20);
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    const dt = last ? Math.min(now - last, 64) : 16; last = now;
    step(dt, now); draw();
    raf = requestAnimationFrame(frame);
  }
  function start() { if (!raf && !reduce && !document.hidden) { last = 0; raf = requestAnimationFrame(frame); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

  makeSprites(); setup(); draw();
  // Keep the calm area up to date as the page switches between states (and through layout transitions)
  setInterval(function () {
    measure();
    if (reduce) {   // reduced motion: static picture, redrawn only when the layout changes
      const key = JSON.stringify(calm) + live;
      if (key !== lastKey) { lastKey = key; draw(); }
    }
  }, 500);
  let resizeT = 0;
  const onResize = function () { clearTimeout(resizeT); resizeT = setTimeout(function () { setup(); draw(); }, 150); };
  window.addEventListener("resize", onResize);
  document.addEventListener("fullscreenchange", onResize);
  document.addEventListener("webkitfullscreenchange", onResize);
  document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else start(); });
  start();
})();
