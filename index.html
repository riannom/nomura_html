<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nomura.network</title>
<meta name="description" content="nomura.network">
<meta name="theme-color" content="#120a1f">
<style>
  :root { --bg: #0b0714; --teal: #14b8a6; --teal-2: #2dd4bf; --teal-3: #0d9488; --plum: #3b1f5c; --violet: #7c3aed; --purple: #a855f7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #ede9f6; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; filter: blur(70px) saturate(120%); }
  .blob { position: absolute; border-radius: 50%; opacity: .75; mix-blend-mode: screen; will-change: transform; }
  .b1 { width: 60vmax; height: 60vmax; left: -15vmax; top: -20vmax; background: radial-gradient(circle at 30% 30%, var(--teal-2), var(--teal-3) 60%, transparent 70%); animation: d1 26s ease-in-out infinite alternate; }
  .b2 { width: 55vmax; height: 55vmax; right: -18vmax; top: -10vmax; background: radial-gradient(circle at 60% 40%, var(--purple), var(--violet) 55%, transparent 70%); animation: d2 32s ease-in-out infinite alternate; }
  .b3 { width: 70vmax; height: 70vmax; left: 10vmax; bottom: -40vmax; background: radial-gradient(circle at 50% 50%, var(--plum), #2a1544 60%, transparent 72%); opacity: .9; animation: d3 38s ease-in-out infinite alternate; }
  .b4 { width: 38vmax; height: 38vmax; right: 5vmax; bottom: -12vmax; background: radial-gradient(circle at 40% 40%, var(--teal), #0f766e 60%, transparent 72%); opacity: .55; animation: d4 29s ease-in-out infinite alternate; }
  @keyframes d1 { 0% { transform: translate(0,0) scale(1) rotate(0deg); border-radius: 50% 45% 55% 50%; } 100% { transform: translate(18vw,14vh) scale(1.15) rotate(40deg); border-radius: 42% 58% 46% 54%; } }
  @keyframes d2 { 0% { transform: translate(0,0) scale(1.05) rotate(0deg); } 100% { transform: translate(-20vw,18vh) scale(.9) rotate(-35deg); } }
  @keyframes d3 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-12vw,-16vh) scale(1.12); } }
  @keyframes d4 { 0% { transform: translate(0,0) scale(.95); } 100% { transform: translate(-26vw,-22vh) scale(1.2); } }
  .grain { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at center, transparent 40%, rgba(5,3,10,.55) 100%); }
  main { position: relative; z-index: 2; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; padding: 6vmin 6vw; text-align: center; }
  h1 { margin: 0; font-weight: 300; letter-spacing: -.03em; font-size: clamp(2.6rem, 11vw, 6.5rem); line-height: 1; }
  h1 span { font-weight: 600; background: linear-gradient(90deg, var(--teal-2), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 0; font-size: clamp(.95rem, 2.6vw, 1.1rem); letter-spacing: .02em; color: rgba(237,233,246,.72); }
  .cta { margin-top: 1.6rem; display: inline-flex; flex-direction: column; align-items: center; gap: .2rem; padding: .95rem 1.6rem; max-width: 92vw;
    border-radius: 999px; text-decoration: none; color: #fff; background: rgba(20,10,35,.38); border: 1px solid rgba(45,212,191,.55);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(10,5,20,.35), inset 0 0 0 1px rgba(168,85,247,.18);
    transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease; }
  .cta strong { font-weight: 600; font-size: clamp(1rem, 3.4vw, 1.15rem); }
  .cta small { font-size: clamp(.85rem, 2.8vw, .95rem); color: var(--teal-2); letter-spacing: .03em; }
  .cta:hover { transform: translateY(-2px); background: rgba(124,58,237,.28); border-color: var(--purple); box-shadow: 0 12px 36px rgba(124,58,237,.35); }
  .cta:focus-visible { outline: 2px solid var(--teal-2); outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none; } .cta { transition: none; } .cta:hover { transform: none; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
<div class="grain" aria-hidden="true"></div>
<main>
  <h1>nomura<span>.network</span></h1>
  <p>Something is taking shape.</p>
  <a class="cta" href="COL/">
    <strong>Carolyn Nomura&#39;s Celebration of Life</strong>
    <small>Watch the stream &rarr;</small>
  </a>
</main>
</body>
</html>
