<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Live stream</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#0f0f10;color:#eee;
       font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:1rem;box-sizing:border-box}
  main{max-width:28rem}
  h1{font-size:clamp(1.3rem,5vw,1.8rem);margin:0 0 .5rem}
  p{margin:.25rem 0;color:#aaa}
  .dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;background:#e33;margin-right:.4rem;animation:p 1.4s infinite}
  @keyframes p{50%{opacity:.25}}
  a{color:#8ab4f8}
</style>
</head>
<body>
<main>
  <h1 id="msg"><span class="dot"></span>Connecting to the stream…</h1>
  <p id="sub">One moment.</p>
</main>
<script>
(function () {
  'use strict';
  var POLL_MS = 30000;
  var ALLOWED_HOSTS = ['youtube.com', 'www.youtube.com', 'm.youtube.com', 'youtu.be'];
  var msg = document.getElementById('msg');
  var sub = document.getElementById('sub');

  // Only https YouTube URLs, no credentials/ports, no odd characters.
  function safeYouTubeUrl(raw) {
    if (typeof raw !== 'string' || raw.length > 500) return null;
    if (!/^https:\/\/[A-Za-z0-9._~:\/?#\[\]@!$&'()*+,;=%-]+$/.test(raw)) return null;
    var u;
    try { u = new URL(raw); } catch (e) { return null; }
    if (u.protocol !== 'https:' || u.username || u.password || u.port) return null;
    if (ALLOWED_HOSTS.indexOf(u.hostname.toLowerCase()) === -1) return null;
    return u.href;
  }

  function waiting(text) {
    msg.innerHTML = '<span class="dot"></span>';
    msg.appendChild(document.createTextNode("Stream interrupted, we'll be back in a minute"));
    sub.textContent = text || 'This page will reconnect automatically.';
  }

  function check() {
    fetch('stream.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        var url = data && safeYouTubeUrl(data.url);
        if (data && data.status === 'live' && url) {
          msg.textContent = 'Stream is live, redirecting…';
          sub.innerHTML = '';
          var a = document.createElement('a'); a.href = url; a.textContent = 'Tap here if nothing happens';
          sub.appendChild(a);
          window.location.replace(url);
          return;
        }
        waiting();
        setTimeout(check, POLL_MS);
      })
      .catch(function () {
        waiting('Waiting for the stream, retrying automatically.');
        setTimeout(check, POLL_MS);
      });
  }

  check();
})();
</script>
</body>
</html>
