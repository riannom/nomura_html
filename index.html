<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live</title>
<script>
  // YouTube channel ID (starts with "UC"). Find yours in YouTube Studio:
  // Settings > Channel > Advanced settings. Change only this line.
  const CHANNEL_ID = "UCuElo0lPHVOnut0zSOM3oAw";
</script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .frame { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; }
  .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div class="stage">
  <div class="frame">
    <iframe id="player"
      title="Live stream"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
</div>
<script>
  document.getElementById("player").src =
    "https://www.youtube.com/embed/live_stream?channel=" + encodeURIComponent(CHANNEL_ID) + "&autoplay=1&mute=1";
</script>
</body>
</html>
